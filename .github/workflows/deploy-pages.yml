name: Deploy pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Decode binary assets
        run: |
          set -euo pipefail
          while IFS= read -r -d '' f; do
            out="${f%.b64}"
            base64 -d "$f" > "$out"
          done < <(find . -type f -name '*.b64' -print0)
          find . -type f -name '*.b64' -delete
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
