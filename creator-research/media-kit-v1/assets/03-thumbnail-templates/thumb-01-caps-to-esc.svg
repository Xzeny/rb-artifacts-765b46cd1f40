<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img"><title>YouTube thumbnail template</title><desc>Thumbnail template: headline CAPS LOCK IS ESC NOW in large white uppercase, a CAPS keycap with an arrow to an ESC keycap, small Rebind mark top-left, dashed creator photo zone on the right.</desc><rect width="1280" height="720" fill="#000000"/><g id="creator-photo-zone"><!-- replace this rect with the creator's own photo, clipped to 760,36 484x648 --><rect x="760" y="36" width="484" height="648" fill="#1a1a1a" stroke="#fff" stroke-width="3" stroke-dasharray="14 12"/></g><g id="TEMPLATE-GUIDES-delete-before-export"><text x="1002" y="300" font-family="Inconsolata, 'Courier New', monospace" font-size="32" font-weight="800" fill="#fff" letter-spacing="0.06em" text-anchor="middle">CREATOR PHOTO ZONE</text><text x="1002" y="344" font-family="Inconsolata, 'Courier New', monospace" font-size="26" font-weight="600" fill="#fff" letter-spacing="0.06em" text-anchor="middle">YOUR OWN PHOTO, CHEST-UP</text><text x="1002" y="388" font-family="Inconsolata, 'Courier New', monospace" font-size="26" font-weight="600" fill="#fff" letter-spacing="0.06em" text-anchor="middle">FACE IN UPPER TWO-THIRDS</text><text x="1002" y="432" font-family="Inconsolata, 'Courier New', monospace" font-size="26" font-weight="600" fill="#fff" letter-spacing="0.06em" text-anchor="middle">DELETE THIS LABEL LAYER</text><rect x="1040" y="610" width="204" height="74" fill="none" stroke="#c8c8c8" stroke-width="2" stroke-dasharray="4 6"/><text x="1142" y="655" font-family="Inconsolata, 'Courier New', monospace" font-size="15" font-weight="600" fill="#c8c8c8" letter-spacing="0.02em" text-anchor="middle">KEEP CLEAR · TIMESTAMP</text></g><g id="rebind-mark"><g fill="#fff" shape-rendering="crispEdges"><rect x="40.00" y="36.00" width="9.80" height="9.80"/><rect x="40.00" y="48.73" width="9.80" height="9.80"/><rect x="40.00" y="61.47" width="9.80" height="9.80"/><rect x="40.00" y="74.20" width="9.80" height="9.80"/><rect x="52.73" y="36.00" width="9.80" height="9.80"/><rect x="65.47" y="36.00" width="9.80" height="9.80"/></g></g><g id="headline-edit-me"><text x="40" y="200" font-family="Inconsolata, 'Courier New', monospace" font-size="112" font-weight="900" fill="#fff" letter-spacing="0.02em" text-anchor="start">CAPS LOCK</text><text x="40" y="318" font-family="Inconsolata, 'Courier New', monospace" font-size="112" font-weight="900" fill="#fff" letter-spacing="0.02em" text-anchor="start">IS ESC</text><text x="40" y="436" font-family="Inconsolata, 'Courier New', monospace" font-size="112" font-weight="900" fill="#fff" letter-spacing="0.02em" text-anchor="start">NOW</text></g><g id="topic-visual"><rect x="40" y="470" width="300" height="160" fill="none" stroke="#fff" stroke-width="3"/><rect x="54" y="484" width="272" height="120" fill="none" stroke="#fff" stroke-opacity="0.45" stroke-width="2"/><text x="190.0" y="558.0" font-family="Inconsolata, 'Courier New', monospace" font-size="40" font-weight="700" fill="#fff" letter-spacing="0.06em" text-anchor="middle">CAPS</text><line x1="350" y1="550" x2="462" y2="550" stroke="#fff" stroke-opacity="1" stroke-width="3" stroke-dasharray="12 18"/><path d="M450 536L480 550L450 564" fill="none" stroke="#fff" stroke-opacity="1" stroke-width="3" stroke-linecap="square"/><rect x="490" y="470" width="220" height="160" fill="none" stroke="#fff" stroke-width="3"/><rect x="504" y="484" width="192" height="120" fill="none" stroke="#fff" stroke-opacity="0.45" stroke-width="2"/><text x="600.0" y="559.6" font-family="Inconsolata, 'Courier New', monospace" font-size="48" font-weight="700" fill="#fff" letter-spacing="0.06em" text-anchor="middle">ESC</text><rect x="676" y="596" width="20" height="20" fill="#b0342c"/></g></svg>
