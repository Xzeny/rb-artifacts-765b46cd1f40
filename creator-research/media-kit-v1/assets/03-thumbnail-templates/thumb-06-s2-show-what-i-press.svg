<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img"><title>YouTube thumbnail template</title><desc>Thumbnail template for S2: headline SEE WHAT I PRESS in large white letters on black; an on-screen keys strip showing CTRL, SHIFT and S keycaps; label marketplace script, step 2 after the app; small Rebind mark top left; dashed creator photo zone on the right.</desc><rect width="1280" height="720" fill="#000000"/><g id="creator-photo-zone"><!-- replace this rect with the creator's own photo, clipped to 760,36 484x648 --><rect x="760" y="36" width="484" height="648" fill="#1a1a1a" stroke="#fff" stroke-width="3" stroke-dasharray="14 12"/></g><g id="TEMPLATE-GUIDES-delete-before-export"><text x="1002" y="300" font-family="Inconsolata, 'Courier New', monospace" font-size="32" font-weight="800" fill="#fff" letter-spacing="0.06em" text-anchor="middle">CREATOR PHOTO ZONE</text><text x="1002" y="344" font-family="Inconsolata, 'Courier New', monospace" font-size="26" font-weight="600" fill="#fff" letter-spacing="0.06em" text-anchor="middle">YOUR OWN PHOTO, CHEST-UP</text><text x="1002" y="388" font-family="Inconsolata, 'Courier New', monospace" font-size="26" font-weight="600" fill="#fff" letter-spacing="0.06em" text-anchor="middle">FACE IN UPPER TWO-THIRDS</text><text x="1002" y="432" font-family="Inconsolata, 'Courier New', monospace" font-size="26" font-weight="600" fill="#fff" letter-spacing="0.06em" text-anchor="middle">DELETE THIS LABEL LAYER</text><rect x="1040" y="610" width="204" height="74" fill="none" stroke="#c8c8c8" stroke-width="2" stroke-dasharray="4 6"/><text x="1142" y="655" font-family="Inconsolata, 'Courier New', monospace" font-size="15" font-weight="600" fill="#c8c8c8" letter-spacing="0.02em" text-anchor="middle">KEEP CLEAR · TIMESTAMP</text></g><g id="rebind-mark"><g fill="#fff" shape-rendering="crispEdges"><rect x="40.00" y="36.00" width="9.80" height="9.80"/><rect x="40.00" y="48.73" width="9.80" height="9.80"/><rect x="40.00" y="61.47" width="9.80" height="9.80"/><rect x="40.00" y="74.20" width="9.80" height="9.80"/><rect x="52.73" y="36.00" width="9.80" height="9.80"/><rect x="65.47" y="36.00" width="9.80" height="9.80"/></g></g><g id="headline-edit-me"><text x="40" y="200" font-family="Inconsolata, 'Courier New', monospace" font-size="112" font-weight="900" fill="#fff" letter-spacing="0.02em" text-anchor="start">SEE WHAT</text><text x="40" y="318" font-family="Inconsolata, 'Courier New', monospace" font-size="112" font-weight="900" fill="#fff" letter-spacing="0.02em" text-anchor="start">I PRESS</text></g><g id="topic-visual"><rect x="40" y="470" width="680" height="150" fill="none" stroke="#fff" stroke-width="3"/><text x="64" y="506" font-family="Inconsolata, 'Courier New', monospace" font-size="22" font-weight="700" fill="#c8c8c8" letter-spacing="0.06em" text-anchor="start">ON-SCREEN KEYS</text><rect x="64" y="526" width="150" height="70" fill="none" stroke="#fff" stroke-width="3"/><text x="139" y="574" font-family="Inconsolata, 'Courier New', monospace" font-size="36" font-weight="800" fill="#fff" letter-spacing="0.06em" text-anchor="middle">CTRL</text><rect x="234" y="526" width="150" height="70" fill="none" stroke="#fff" stroke-width="3"/><text x="309" y="574" font-family="Inconsolata, 'Courier New', monospace" font-size="36" font-weight="800" fill="#fff" letter-spacing="0.06em" text-anchor="middle">SHIFT</text><rect x="404" y="526" width="150" height="70" fill="none" stroke="#fff" stroke-width="3"/><text x="479" y="574" font-family="Inconsolata, 'Courier New', monospace" font-size="36" font-weight="800" fill="#fff" letter-spacing="0.06em" text-anchor="middle">S</text><rect x="534" y="580" width="16" height="16" fill="#b0342c"/><text x="40" y="680" font-family="Inconsolata, 'Courier New', monospace" font-size="22" font-weight="700" fill="#fff" letter-spacing="0.06em" text-anchor="start">MARKETPLACE SCRIPT · STEP 2 AFTER THE APP</text></g></svg>
