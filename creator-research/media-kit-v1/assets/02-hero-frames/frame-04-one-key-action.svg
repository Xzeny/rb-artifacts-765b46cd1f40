<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" role="img"><title>Simulated UI frame</title><desc>Simulated UI frame: one SPARE KEY keycap with a dashed arrow to three keycaps CTRL + SHIFT + Z (Mac: Command + Shift + Z). Caption: no holding three keys at once. Labeled Simulated UI / animated mock-up.</desc><rect width="1920" height="1080" fill="#000000"/><path transform="translate(96 64) scale(0.6667)" d="M21 12H35V26H21ZM21 31H35V45H21ZM21 50H35V64H21ZM21 69H35V83H21ZM40 12H54V26H40ZM59 12H73V26H59Z" fill="none" stroke="#fff" stroke-width="3.750" stroke-linecap="square" stroke-linejoin="miter"/><text x="176" y="108" font-family="Inconsolata, 'Courier New', monospace" font-size="30" font-weight="700" fill="#fff" letter-spacing="0.06em" text-anchor="start">REBIND</text><rect x="1296" y="60" width="528" height="64" fill="#000" stroke="#fff" stroke-width="2"/><text x="1560" y="102" font-family="Inconsolata, 'Courier New', monospace" font-size="28" font-weight="700" fill="#fff" letter-spacing="0.02em" text-anchor="middle">Simulated UI / animated mock-up</text><text x="96" y="236" font-family="Inconsolata, 'Courier New', monospace" font-size="84" font-weight="800" fill="#fff" letter-spacing="0.06em" text-anchor="start">ONE KEY, WHOLE SHORTCUT</text><text x="96" y="300" font-family="Inconsolata, 'Courier New', monospace" font-size="34" font-weight="500" fill="#c8c8c8" letter-spacing="0.06em" text-anchor="start">ONE PRESS SENDS A THREE-KEY CHORD · EXAMPLE: REDO</text><line x1="96" y1="340" x2="1824" y2="340" stroke="#fff" stroke-opacity="0.25" stroke-width="2"/><text x="96" y="1024" font-family="Inconsolata, 'Courier New', monospace" font-size="26" font-weight="500" fill="#c8c8c8" letter-spacing="0.06em" text-anchor="start">WINDOWS 10/11 64-BIT · MACOS 13+ ON APPLE SILICON · FREE APP · NO ACCOUNT FOR LOCAL SCRIPTS</text><path d="M40 80V40H80" fill="none" stroke="#fff" stroke-opacity="0.45" stroke-width="2" stroke-linecap="square"/><path d="M1880 80V40H1840" fill="none" stroke="#fff" stroke-opacity="0.45" stroke-width="2" stroke-linecap="square"/><path d="M40 1000V1040H80" fill="none" stroke="#fff" stroke-opacity="0.45" stroke-width="2" stroke-linecap="square"/><path d="M1880 1000V1040H1840" fill="none" stroke="#fff" stroke-opacity="0.45" stroke-width="2" stroke-linecap="square"/><rect x="160" y="470" width="360" height="220" fill="none" stroke="#fff" stroke-width="3"/><rect x="174" y="484" width="332" height="180" fill="none" stroke="#fff" stroke-opacity="0.45" stroke-width="2"/><text x="340.0" y="588.0" font-family="Inconsolata, 'Courier New', monospace" font-size="40" font-weight="700" fill="#fff" letter-spacing="0.06em" text-anchor="middle">SPARE KEY</text><rect x="486" y="656" width="20" height="20" fill="#b0342c"/><line x1="560" y1="580" x2="802" y2="580" stroke="#fff" stroke-opacity="1" stroke-width="3" stroke-dasharray="12 18"/><path d="M790 566L820 580L790 594" fill="none" stroke="#fff" stroke-opacity="1" stroke-width="3" stroke-linecap="square"/><rect x="860" y="470" width="260" height="220" fill="none" stroke="#fff" stroke-width="3"/><rect x="874" y="484" width="232" height="180" fill="none" stroke="#fff" stroke-opacity="0.45" stroke-width="2"/><text x="990.0" y="588.8" font-family="Inconsolata, 'Courier New', monospace" font-size="44" font-weight="700" fill="#fff" letter-spacing="0.06em" text-anchor="middle">CTRL</text><text x="1150" y="600" font-family="Inconsolata, 'Courier New', monospace" font-size="56" font-weight="600" fill="#c8c8c8" letter-spacing="0.06em" text-anchor="middle">+</text><rect x="1180" y="470" width="300" height="220" fill="none" stroke="#fff" stroke-width="3"/><rect x="1194" y="484" width="272" height="180" fill="none" stroke="#fff" stroke-opacity="0.45" stroke-width="2"/><text x="1330.0" y="588.8" font-family="Inconsolata, 'Courier New', monospace" font-size="44" font-weight="700" fill="#fff" letter-spacing="0.06em" text-anchor="middle">SHIFT</text><text x="1510" y="600" font-family="Inconsolata, 'Courier New', monospace" font-size="56" font-weight="600" fill="#c8c8c8" letter-spacing="0.06em" text-anchor="middle">+</text><rect x="1540" y="470" width="220" height="220" fill="none" stroke="#fff" stroke-width="3"/><rect x="1554" y="484" width="192" height="180" fill="none" stroke="#fff" stroke-opacity="0.45" stroke-width="2"/><text x="1650.0" y="591.2" font-family="Inconsolata, 'Courier New', monospace" font-size="56" font-weight="700" fill="#fff" letter-spacing="0.06em" text-anchor="middle">Z</text><text x="340" y="740" font-family="Inconsolata, 'Courier New', monospace" font-size="26" font-weight="600" fill="#c8c8c8" letter-spacing="0.06em" text-anchor="middle">YOU PRESS ONE KEY</text><text x="1310" y="740" font-family="Inconsolata, 'Courier New', monospace" font-size="26" font-weight="600" fill="#c8c8c8" letter-spacing="0.06em" text-anchor="middle">THE APP RECEIVES THE CHORD</text><text x="860" y="800" font-family="Inconsolata, 'Courier New', monospace" font-size="28" font-weight="600" fill="#c8c8c8" letter-spacing="0.06em" text-anchor="start">MAC: COMMAND + SHIFT + Z</text><rect x="160" y="850" width="1600" height="90" fill="none" stroke="#fff" stroke-width="2"/><text x="190" y="907" font-family="Inconsolata, 'Courier New', monospace" font-size="28" font-weight="600" fill="#fff" letter-spacing="0.06em" text-anchor="start">NO HOLDING THREE KEYS AT ONCE · WORKS IN APPS THAT USE THIS SHORTCUT</text></svg>
