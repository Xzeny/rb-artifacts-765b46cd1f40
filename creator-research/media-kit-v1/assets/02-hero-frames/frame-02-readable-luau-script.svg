<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" role="img"><title>Simulated UI frame</title><desc>Simulated UI frame: a plain-text editor pane showing capslock-to-escape.luau with comments, the single line rb.bind.remap(&quot;CapsLock&quot;, &quot;Escape&quot;), and the kill-switch chord written as comments. Labeled Simulated UI / animated mock-up.</desc><rect width="1920" height="1080" fill="#000000"/><path transform="translate(96 64) scale(0.6667)" d="M21 12H35V26H21ZM21 31H35V45H21ZM21 50H35V64H21ZM21 69H35V83H21ZM40 12H54V26H40ZM59 12H73V26H59Z" fill="none" stroke="#fff" stroke-width="3.750" stroke-linecap="square" stroke-linejoin="miter"/><text x="176" y="108" font-family="Inconsolata, 'Courier New', monospace" font-size="30" font-weight="700" fill="#fff" letter-spacing="0.06em" text-anchor="start">REBIND</text><rect x="1296" y="60" width="528" height="64" fill="#000" stroke="#fff" stroke-width="2"/><text x="1560" y="102" font-family="Inconsolata, 'Courier New', monospace" font-size="28" font-weight="700" fill="#fff" letter-spacing="0.02em" text-anchor="middle">Simulated UI / animated mock-up</text><text x="96" y="236" font-family="Inconsolata, 'Courier New', monospace" font-size="84" font-weight="800" fill="#fff" letter-spacing="0.06em" text-anchor="start">A SCRIPT YOU CAN READ</text><text x="96" y="300" font-family="Inconsolata, 'Courier New', monospace" font-size="34" font-weight="500" fill="#c8c8c8" letter-spacing="0.06em" text-anchor="start">A REBIND SCRIPT IS A PLAIN .LUAU TEXT FILE · OPEN IT IN YOUR OWN EDITOR</text><line x1="96" y1="340" x2="1824" y2="340" stroke="#fff" stroke-opacity="0.25" stroke-width="2"/><text x="96" y="1024" font-family="Inconsolata, 'Courier New', monospace" font-size="26" font-weight="500" fill="#c8c8c8" letter-spacing="0.06em" text-anchor="start">WINDOWS 10/11 64-BIT · MACOS 13+ ON APPLE SILICON · FREE APP · NO ACCOUNT FOR LOCAL SCRIPTS</text><path d="M40 80V40H80" fill="none" stroke="#fff" stroke-opacity="0.45" stroke-width="2" stroke-linecap="square"/><path d="M1880 80V40H1840" fill="none" stroke="#fff" stroke-opacity="0.45" stroke-width="2" stroke-linecap="square"/><path d="M40 1000V1040H80" fill="none" stroke="#fff" stroke-opacity="0.45" stroke-width="2" stroke-linecap="square"/><path d="M1880 1000V1040H1840" fill="none" stroke="#fff" stroke-opacity="0.45" stroke-width="2" stroke-linecap="square"/><rect x="96" y="390" width="1240" height="580" fill="none" stroke="#fff" stroke-width="2"/><line x1="96" y1="450" x2="1336" y2="450" stroke="#fff" stroke-opacity="0.45" stroke-width="2"/><text x="126" y="432" font-family="Inconsolata, 'Courier New', monospace" font-size="26" font-weight="700" fill="#fff" letter-spacing="0.06em" text-anchor="start">CAPSLOCK-TO-ESCAPE.LUAU</text><text x="1306" y="432" font-family="Inconsolata, 'Courier New', monospace" font-size="22" font-weight="600" fill="#c8c8c8" letter-spacing="0.06em" text-anchor="end">PLAIN TEXT</text><text x="150" y="512" font-family="Inconsolata, 'Courier New', monospace" font-size="30" font-weight="500" fill="#9a9a9a" letter-spacing="0em" text-anchor="end">1</text><text x="186" y="512" font-family="Inconsolata, 'Courier New', monospace" font-size="34" font-weight="500" fill="#c8c8c8" letter-spacing="0em" text-anchor="start">-- capslock-to-escape.luau</text><text x="150" y="570" font-family="Inconsolata, 'Courier New', monospace" font-size="30" font-weight="500" fill="#9a9a9a" letter-spacing="0em" text-anchor="end">2</text><text x="186" y="570" font-family="Inconsolata, 'Courier New', monospace" font-size="34" font-weight="500" fill="#c8c8c8" letter-spacing="0em" text-anchor="start">-- A Rebind script is a plain text file.</text><text x="150" y="628" font-family="Inconsolata, 'Courier New', monospace" font-size="30" font-weight="500" fill="#9a9a9a" letter-spacing="0em" text-anchor="end">3</text><text x="186" y="628" font-family="Inconsolata, 'Courier New', monospace" font-size="34" font-weight="500" fill="#c8c8c8" letter-spacing="0em" text-anchor="start">-- This line turns Caps Lock into Escape:</text><text x="150" y="686" font-family="Inconsolata, 'Courier New', monospace" font-size="30" font-weight="500" fill="#9a9a9a" letter-spacing="0em" text-anchor="end">4</text><text x="186" y="686" font-family="Inconsolata, 'Courier New', monospace" font-size="34" font-weight="700" fill="#fff" letter-spacing="0em" text-anchor="start">rb.bind.remap(&quot;CapsLock&quot;, &quot;Escape&quot;)</text><text x="150" y="744" font-family="Inconsolata, 'Courier New', monospace" font-size="30" font-weight="500" fill="#9a9a9a" letter-spacing="0em" text-anchor="end">5</text><text x="186" y="744" font-family="Inconsolata, 'Courier New', monospace" font-size="34" font-weight="700" fill="#fff" letter-spacing="0em" text-anchor="start"></text><text x="150" y="802" font-family="Inconsolata, 'Courier New', monospace" font-size="30" font-weight="500" fill="#9a9a9a" letter-spacing="0em" text-anchor="end">6</text><text x="186" y="802" font-family="Inconsolata, 'Courier New', monospace" font-size="34" font-weight="500" fill="#c8c8c8" letter-spacing="0em" text-anchor="start">-- Stop every script with the kill switch:</text><text x="150" y="860" font-family="Inconsolata, 'Courier New', monospace" font-size="30" font-weight="500" fill="#9a9a9a" letter-spacing="0em" text-anchor="end">7</text><text x="186" y="860" font-family="Inconsolata, 'Courier New', monospace" font-size="34" font-weight="500" fill="#c8c8c8" letter-spacing="0em" text-anchor="start">-- Left Ctrl + Left Alt + K</text><text x="150" y="918" font-family="Inconsolata, 'Courier New', monospace" font-size="30" font-weight="500" fill="#9a9a9a" letter-spacing="0em" text-anchor="end">8</text><text x="186" y="918" font-family="Inconsolata, 'Courier New', monospace" font-size="34" font-weight="500" fill="#c8c8c8" letter-spacing="0em" text-anchor="start">-- Mac: Left Control + Left Option + K</text><rect x="787" y="656" width="18" height="38" fill="#b0342c"/><text x="1400" y="430" font-family="Inconsolata, 'Courier New', monospace" font-size="28" font-weight="700" fill="#fff" letter-spacing="0.06em" text-anchor="start">WHAT YOU SEE</text><rect x="1400" y="478" width="18" height="18" fill="none" stroke="#fff" stroke-width="2"/><text x="1440" y="496" font-family="Inconsolata, 'Courier New', monospace" font-size="26" font-weight="500" fill="#c8c8c8" letter-spacing="0.06em" text-anchor="start">ONE DOCUMENTED CALL</text><rect x="1400" y="548" width="18" height="18" fill="none" stroke="#fff" stroke-width="2"/><text x="1440" y="566" font-family="Inconsolata, 'Courier New', monospace" font-size="26" font-weight="500" fill="#c8c8c8" letter-spacing="0.06em" text-anchor="start">COMMENTS IN PLAIN WORDS</text><rect x="1400" y="618" width="18" height="18" fill="none" stroke="#fff" stroke-width="2"/><text x="1440" y="636" font-family="Inconsolata, 'Courier New', monospace" font-size="26" font-weight="500" fill="#c8c8c8" letter-spacing="0.06em" text-anchor="start">KILL SWITCH WRITTEN DOWN</text><rect x="1400" y="688" width="18" height="18" fill="none" stroke="#fff" stroke-width="2"/><text x="1440" y="706" font-family="Inconsolata, 'Courier New', monospace" font-size="26" font-weight="500" fill="#c8c8c8" letter-spacing="0.06em" text-anchor="start">KEEP IT IN GIT IF YOU LIKE</text></svg>
