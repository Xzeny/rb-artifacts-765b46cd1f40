<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" role="img"><title>Simulated UI frame</title><desc>Simulated UI frame: three keycaps LEFT CTRL + LEFT ALT + K, with text: Windows Left Ctrl + Left Alt + K; Mac Left Control + Left Option + K; stops every script and releases held input. Labeled Simulated UI / animated mock-up.</desc><rect width="1920" height="1080" fill="#000000"/><path transform="translate(96 64) scale(0.6667)" d="M21 12H35V26H21ZM21 31H35V45H21ZM21 50H35V64H21ZM21 69H35V83H21ZM40 12H54V26H40ZM59 12H73V26H59Z" fill="none" stroke="#fff" stroke-width="3.750" stroke-linecap="square" stroke-linejoin="miter"/><text x="176" y="108" font-family="Inconsolata, 'Courier New', monospace" font-size="30" font-weight="700" fill="#fff" letter-spacing="0.06em" text-anchor="start">REBIND</text><rect x="1296" y="60" width="528" height="64" fill="#000" stroke="#fff" stroke-width="2"/><text x="1560" y="102" font-family="Inconsolata, 'Courier New', monospace" font-size="28" font-weight="700" fill="#fff" letter-spacing="0.02em" text-anchor="middle">Simulated UI / animated mock-up</text><text x="96" y="236" font-family="Inconsolata, 'Courier New', monospace" font-size="84" font-weight="800" fill="#fff" letter-spacing="0.06em" text-anchor="start">KILL SWITCH</text><text x="96" y="300" font-family="Inconsolata, 'Courier New', monospace" font-size="34" font-weight="500" fill="#c8c8c8" letter-spacing="0.06em" text-anchor="start">STOPS EVERY SCRIPT AND RELEASES HELD INPUT</text><line x1="96" y1="340" x2="1824" y2="340" stroke="#fff" stroke-opacity="0.25" stroke-width="2"/><text x="96" y="1024" font-family="Inconsolata, 'Courier New', monospace" font-size="26" font-weight="500" fill="#c8c8c8" letter-spacing="0.06em" text-anchor="start">WINDOWS 10/11 64-BIT · MACOS 13+ ON APPLE SILICON · FREE APP · NO ACCOUNT FOR LOCAL SCRIPTS</text><path d="M40 80V40H80" fill="none" stroke="#fff" stroke-opacity="0.45" stroke-width="2" stroke-linecap="squar