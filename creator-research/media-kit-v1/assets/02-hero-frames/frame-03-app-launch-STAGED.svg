<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" role="img"><title>STAGED, not in kit. Simulated UI frame</title><desc>STAGED, not in kit. Simulated UI frame: a NUM 7 spare keycap with a dashed arrow labelled starts to an app window titled your editor, started by the script; the SDK signature rb.system.exec_detached(cmd: string, options: RbExecDetachedOptions?) -&gt; number, needs the exec permission; recipe: Rebind Cookbook (link pending). Labeled Simulated UI / animated mock-up.</desc><rect width="1920" height="1080" fill="#000000"/><path transform="translate(96 64) scale(0.6667)" d="M21 12H35V26H21ZM21 31H35V45H21ZM21 50H35V64H21ZM21 69H35V83H21ZM40 12H54V26H40ZM59 12H73V26H59Z" fill="none" stroke="#fff" stroke-width="3.750" stroke-linecap="square" stroke-linejoin="miter"/><text x="176" y="108" font-family="Inconsolata, 'Courier New', monospace" font-size="30" font-weight="700" fill="#fff" letter-spacing="0.06em" text-anchor="start">REBIND</text><rect x="1296" y="60" width="528" height="64" fill="#000" stroke="#fff" stroke-width="2"/><text x="1560" y="102" font-family="Inconsolata, 'Courier New', monospace" font-size="28" font-weight="700" fill="#fff" letter-spacing="0.02em" text-anchor="middle">Simulated UI / animated mock-up</text><text x="96" y="236" font-family="Inconsolata, 'Courier New', monospace" font-size="84" font-weight="800" fill="#fff" letter-spacing="0.06em" text-anchor="start">ONE KEY OPENS YOUR EDITOR</text><text x="96" y="300" font-family="Inconsolata, 'Courier New', monospace" font-size="34" font-weight="500" fill="#c8c8c8" letter-spacing="0.06em" text-anchor="start">STARTS THE APP FROM A SPARE KEY · SAME IDEA ON WINDOWS AND MAC</text><line x1="96" y1="340" x2="1824" y2="340" stroke="#fff" stroke-opacity="0.25" stroke-width="2"/><text x="96" y="1024" font-family="Inconsolata, 'Courier New', monospace" font-size="26" font-weight="500" fill="#c8c8c8" letter-spacing="0.06em" text-anchor="start">WINDOWS 10/11 64-BIT · MACOS 13+ ON APPLE SILICON · FREE APP · NO ACCOUNT FOR LOCAL SCRIPTS</text><path d="M40 80V40H80" fill="none" stroke="#fff" stroke-opacity="0.45" stroke-width="2" stroke-linecap="square"/><path d="M1880 80V40H1840" fill="none" stroke="#fff" stroke-opacity="0.45" stroke-width="2" stroke-linecap="square"/><path d="M40 1000V1040H80" fill="none" stroke="#fff" stroke-opacity="0.45" stroke-width="2" stroke-linecap="square"/><path d="M1880 1000V1040H1840" fill="none" stroke="#fff" stroke-opacity="0.45" stroke-width="2" stroke-linecap="square"/><rect x="140" y="410" width="340" height="220" fill="none" stroke="#fff" stroke-width="3"/><rect x="154" y="424" width="312" height="180" fill="none" stroke="#fff" stroke-opacity="0.45" stroke-width="2"/><text x="310.0" y="530.4" font-family="Inconsolata, 'Courier New', monospace" font-size="52" font-weight="700" fill="#fff" letter-spacing="0.06em" text-anchor="middle">NUM 7</text><rect x="446" y="596" width="20" height="20" fill="#b0342c"/><text x="310" y="680" font-family="Inconsolata, 'Courier New', monospace" font-size="26" font-weight="600" fill="#c8c8c8" letter-spacing="0.06em" text-anchor="middle">YOU PRESS A SPARE KEY</text><line x1="520" y1="520" x2="742" y2="520" stroke="#fff" stroke-opacity="1" stroke-width="3" stroke-dasharray="12 18"/><path d="M730 506L760 520L730 534" fill="none" stroke="#fff" stroke-opacity="1" stroke-width="3" stroke-linecap="square"/><text x="640" y="490" font-family="Inconsolata, 'Courier New', monospace" font-size="24" font-weight="600" fill="#c8c8c8" letter-spacing="0.06em" text-anchor="middle">STARTS</text><rect x="800" y="380" width="1020" height="300" fill="none" stroke="#fff" stroke-width="3"/><line x1="800" y1="440" x2="1820" y2="440" stroke="#fff" stroke-opacity="0.45" stroke-width="2"/><text x="830" y="422" font-family="Inconsolata, 'Courier New', monospace" font-size="30" font-weight="800" fill="#fff" letter-spacing="0.06em" text-anchor="start">YOUR EDITOR</text><text x="1790" y="422" font-family="Inconsolata, 'Courier New', monospace" font-size="22" font-weight="600" fill="#c8c8c8" letter-spacing="0.06em" text-anchor="end">STARTED BY THE SCRIPT</text><rect x="840" y="480" width="620" height="18" fill="none" stroke="#fff" stroke-opacity="0.25" stroke-width="2"/><rect x="840" y="528" width="840" height="18" fill="none" stroke="#fff" stroke-opacity="0.25" stroke-width="2"/><rect x="840" y="576" width="520" height="18" fill="none" stroke="#fff" stroke-opacity="0.25" stroke-width="2"/><rect x="840" y="624" width="760" height="18" fill="none" stroke="#fff" stroke-opacity="0.25" stroke-width="2"/><rect x="140" y="720" width="1680" height="230" fill="none" stroke="#fff" stroke-width="2"/><text x="170" y="762" font-family="Inconsolata, 'Courier New', monospace" font-size="22" font-weight="700" fill="#c8c8c8" letter-spacing="0.06em" text-anchor="start">SDK SIGNATURE · NEEDS THE EXEC PERMISSION</text><text x="170" y="818" font-family="Inconsolata, 'Courier New', monospace" font-size="33" font-weight="700" fill="#fff" letter-spacing="0em" text-anchor="start">rb.system.exec_detached(cmd: string, options: RbExecDetachedOptions?) -&gt; number</text><text x="170" y="870" font-family="Inconsolata, 'Courier New', monospace" font-size="22" font-weight="500" fill="#c8c8c8" letter-spacing="0.06em" text-anchor="start">APP NAME IS AN EXAMPLE · RETURNS THE PROCESS ID</text><text x="170" y="920" font-family="Inconsolata, 'Courier New', monospace" font-size="26" font-weight="700" fill="#fff" letter-spacing="0.06em" text-anchor="start">RECIPE: REBIND COOKBOOK (LINK PENDING)</text></svg>
